  <script>
  (()=>{
    const STORAGE='sts-adviser-v1';
    async function prepareBooking(quoteId){if(!['Admin','Manager'].includes(sessionUser?.role)){notify('Only managers can prepare bookings.');return}if(!confirm('Create a booking in preparation? This does not confirm the course or place.'))return;try{const {quote}=await apiFetch(`/quotes/${quoteId}`);if(!quote||!['SENT','ACCEPTED'].includes(quote.status)){notify('A sent or accepted quote is required.');return}await apiFetch('/bookings',{method:'POST',body:{customerId:quote.customer.id,leadId:quote.leadId||undefined,quoteId:quote.id,depositPence:quote.depositPence}});notify('Booking created in preparation.');setView('bookings')}catch(error){notify(`Booking could not be prepared: ${error.message}`)}}
    const stages=['Customer details','Goal identified','Licence checked','Eligibility information','Medical','Provisional entitlement','Theory tests','CPC requirement','Practical training','Location / availability','Package recommendation','Quote','Objections','Closing','Follow-up / booking'];
    const questions=[
      {id:'goal',stage:1,title:'What would you like to be able to drive or do?',why:'The vehicle and your intended use point us toward the right licence category and whether professional CPC questions apply.',options:['Articulated lorry','Rigid lorry','7.5 tonne vehicle','Bus or coach','Minibus','Drive professionally','Upgrade my licence','Get Driver CPC','Not sure'],type:'goal'},
      {id:'licence',stage:2,title:'Do you hold a full UK car (Category B) driving licence?',why:'This helps establish the starting point for a commercial vehicle route. We will verify actual entitlements rather than infer them from age or dates.',options:['Yes','No','Not sure'],type:'choice'},
      {id:'held',stage:2,title:'Which relevant categories are currently shown on your licence?',why:'Existing C1, C, C+E, D or D1 entitlement can change the next steps. Ask the customer to check the licence record; do not assume acquired rights.',options:['C1','C','C+E','D1','D','None of these','Not sure'],type:'multi'},
      {id:'age',stage:3,title:'What is your age, and when did you first obtain Category B?',why:'Age and licence dates can affect what needs checking, but they are not enough to establish entitlement. Verify the record against current DVLA guidance.',options:['Record details'],type:'text'},
      {id:'medical',stage:4,title:'Have you completed the required commercial driver medical (D4), or is one booked?',why:'Medical and provisional steps are often needed before training or tests. Do not assess medical fitness; refer questions to DVLA or an appropriate medical professional.',options:['Completed','Booked','Not yet','Not sure'],type:'choice'},
      {id:'provisional',stage:5,title:'Does your licence show provisional entitlement for the category you want?',why:'The correct provisional entitlement should be confirmed before a training or test booking is finalised.',options:['Yes','No','Not sure'],type:'choice'},
      {id:'theory',stage:6,title:'What is the status of your theory and hazard perception tests?',why:'Test requirements vary by route and prior qualifications. Record each result separately and check validity before relying on it.',options:['Both passed','Booked','Some passed','Not started','Not sure'],type:'choice'},
      {id:'cpc',stage:7,title:'Will you drive commercially as part of your work?',why:'Professional driving can affect Driver CPC requirements. Exemptions and rules change, so confirm the current GOV.UK / DVSA position.',options:['Yes, professionally','No, private use','Not sure'],type:'choice'},
      {id:'cpcStatus',stage:7,title:'What Driver CPC qualification or modules do you need, or already hold?',why:'Initial Module 2 / Module 4 and periodic CPC are different routes. Record the customer’s current position and verify it against current guidance.',options:['Initial Driver CPC','Module 2 passed','Module 4 passed','Periodic training','Not sure'],type:'multi'},
      {id:'experience',stage:8,title:'How much relevant large-vehicle driving or training have you done?',why:'Experience and confidence help us decide whether to arrange an assessment, refresher or standard/extended course. No hour band guarantees a pass.',options:['No experience','Some training','UK HGV experience','International experience','Need refresher'],type:'choice'},
      {id:'location',stage:9,title:'Which training area and dates would work best for you?',why:'Location and availability let us compare suitable partner centres and realistic course dates.',options:['Enter preferred area or dates'],type:'text'},

    function questionMarkup(q){const answer=state.answers[q.id],position=relevantQuestions().findIndex(item=>item.id===q.id)+1,total=relevantQuestions().length;return `<div class="question-kicker"><span>Ask customer next</span><small>Step ${position} of ${total}</small></div><h2>${esc(q.title)}</h2><p class="why"><strong style="color:#46534f">Why we’re asking</strong> &nbsp;${esc(q.why)}</p><p class="answer-label">${q.type==='multi'?'Choose all that apply':q.type==='text'?'Capture their answer':'Possible answers'}</p>${q.type==='text'?`<div class="answer-entry"><input id="answer-input" placeholder="${esc(q.options[0])}" value="${esc(state.questionNotes[q.id]||'')}"><button class="btn accent" data-action="submit-text" data-id="${q.id}">Record</button></div>`:`<div class="answer-options">${q.options.map(v=>`<button class="answer-option ${answer===v||Array.isArray(answer)&&answer.includes(v)?'selected':''}" data-answer="${esc(v)}" data-id="${q.id}" data-type="${q.type}">${esc(v)}</button>`).join('')}</div>${q.type==='goal'?`<div class="answer-entry"><input id="answer-input" placeholder="Or describe their goal in their own words..."><button class="btn" data-action="submit-text" data-id="goal">Add detail</button></div>`:''}`}${answer?`<div class="divider"></div><p class="field-note"><strong>Interpretation:</strong> ${esc(interpreted(q,Array.isArray(answer)?answer.join(', '):answer))}</p>`:''}<div class="question-bottom"><small>Progress updates as answers are recorded.</small><button class="btn small" data-action="skip-question" data-id="${q.id}">Skip for now →</button></div>`}
    function renderCoach(q){if(!q)return `<div class="coach"><label>Closing opportunity</label><strong>Agree the next action, not an outcome.</strong><p>Offer a quote, a course-date check or a follow-up. Make inclusions, payment terms and any conditions clear.</p></div><div class="coach-section"><label>Suggested close</label><p>“Would it help if I sent you an itemised quote and checked the next available dates?”</p></div>`;const a=state.answers[q.id];return `<div class="coach"><label>Ask this next</label><strong>${esc(q.title)}</strong><p>${esc(q.why)}</p></div><div class="coach-section"><label>Possible answer interpretation</label><p>${a?esc(interpreted(q,Array.isArray(a)?a.join(', '):a)):'Listen for the customer’s exact wording; if unclear, use “not sure” and record what needs verifying.'}</p></div><div class="coach-section"><label>Suggested explanation</label><p>${q.id==='goal'?'“I’ll check the licence route against what you want to drive and the entitlement shown on your record.”':q.id==='medical'?'“We can explain the process, but only DVLA or an appropriate medical professional can confirm medical eligibility.”':q.id==='cpc'?'“CPC requirements depend on how you’ll use the vehicle. I’ll verify the current guidance before we include it.”':'“This helps us recommend the right next step; we will confirm details before booking.”'}</p></div><div class="coach-section"><label>Sales opportunity</label><p>${q.id==='budget'?'Offer an itemised package and explain deposit / balance clearly.':q.id==='location'?'Compare partner centres by category, dates and total cost.':'Keep the recommendation tied to the customer’s stated goal and verified requirements.'}</p></div><div class="coach-section"><label>Objection prompt</label><p>${state.answers.objection?`Concern noted: ${esc(state.answers.objection)}. Ask what part needs clarifying and respond with written detail.`:'If a concern arises, clarify it and answer transparently. Avoid urgency or unsupported pass claims.'}</p></div>`}
    function outstandingChecks(){const list=[],cpcOnly=route()==='Driver CPC';if(!state.answers.licence)list.push('UK licence');if(!state.answers.held)list.push('held categories');if(!cpcOnly&&!state.answers.medical)list.push('D4 / medical status');if(!cpcOnly&&!state.answers.provisional)list.push('provisional entitlement');if(!cpcOnly&&!state.answers.theory)list.push('theory status');if((cpcOnly||state.answers.cpc==='Yes, professionally')&&!state.answers.cpcStatus)list.push('Driver CPC qualification / module status');if(route()==='C+E'&&!/C/.test(JSON.stringify(state.answers.held||'')))list.push('Category C entitlement');return list.length?list.join(' · '):'Confirm supporting evidence and current requirements before booking.'}
    function suggestPackage(){if(route()==='Driver CPC')return 'Driver CPC · Confirm whether initial Module 2 / Module 4 or periodic training applies, then verify recorded qualification and hours.';const e=state.answers.experience||'';const band=/experience|training|refresher/i.test(e)?'Assessment required or short refresher':'Assessment-led standard course';return `${routeLabel()} · ${band}. Final hours depend on assessment and centre availability; no course duration guarantees a pass.`}

    function renderDashboard(){const due=state.leads.filter(l=>l.followup&&new Date(l.followup).toDateString()===new Date().toDateString()).length;const qualified=state.leads.filter(l=>l.status==='Qualified').length;const quotes=state.leads.filter(l=>l.status==='Quote Sent').length;return `${pageHead('Dashboard','A live view of customer conversations, pipeline and today’s follow-ups.',`<button class="btn" data-view="leads">View leads</button><button class="btn primary" data-view="call">＋ &nbsp;New call</button>`)}<div class="quick-row"><button class="btn" data-view="call">＋ New lead</button><button class="btn" data-action="open-quote">▤ Create quote</button><button class="btn" data-view="bookings">▣ Book training</button><button class="btn" data-action="open-followup">◷ Add follow-up</button></div><div class="grid stats"><div class="stat"><div class="stat-top">New leads today <span class="stat-icon">♙</span></div><div class="stat-value">${state.leads.filter(l=>new Date(l.created).toDateString()===new Date().toDateString()).length}</div><div class="stat-note">Saved in this workspace</div></div><div class="stat"><div class="stat-top">Qualified leads <span class="stat-icon">✓</span></div><div class="stat-value">${qualified}</div><div class="stat-note good">Qualification confirmed by adviser</div></div><div class="stat"><div class="stat-top">Quotes sent <span class="stat-icon">▤</span></div><div class="stat-value">${quotes}</div><div class="stat-note">Open quote follow-ups</div></div><div class="stat"><div class="stat-top">Follow-ups due today <span class="stat-icon">◷</span></div><div class="stat-value">${due}</div><div class="stat-note">${state.leads.filter(l=>l.followup&&new Date(l.followup)<new Date()&&new Date(l.followup).toDateString()!==new Date().toDateString()).length} overdue</div></div><div class="stat"><div class="stat-top">Pipeline estimate <span class="stat-icon">£</span></div><div class="stat-value">£${money(state.leads.reduce((a,l)=>a+Number(l.quote||0),     function renderFollowups(){queueMicrotask(()=>void loadFollowups());return `${pageHead('Follow-ups','Server-scheduled call-backs, quote reviews, documents, tests, and payment actions.',`<button class="btn primary" data-action="open-followup">＋ &nbsp;Add follow-up</button>`)}<div class="panel" id="server-followup-list"><div class="empty"><b>Loading follow-ups</b>Retrieving scheduled actions from the server.</div></div>`}
    async function loadFollowups(){const root=$('#server-followup-list');if(!root)return;try{const {followUps=[]}=await apiFetch('/follow-ups?limit=300');root.innerHTML=followUps.length?`<div class="panel-heading"><div><h2>Scheduled follow-ups</h2><p>${followUps.length} actions scheduled</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Reason</th><th>Due</th><th>Assigned adviser</th><th>Status</th></tr></thead><tbody>${followUps.map(item=>`<tr><td><strong>${esc([item.customer?.firstName,item.customer?.lastName].filter(Boolean).join(' ')||'Customer')}</strong><small style="display:block;color:#75817e;margin-top:3px">${esc(item.customer?.phone||'')}</small></td><td>${esc(item.reason)}</td><td>${new Date(item.dueAt).toLocaleString('en-GB')}</td><td>${esc(item.assignedTo?.name||'')}</td><td><span class="pill ${item.status==='COMPLETED'?'green':new Date(item.dueAt)<new Date()?'red':'blue'}">${new Date(item.dueAt)<new Date()&&item.status==='OPEN'?'Overdue':esc(item.status)}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>No follow-ups scheduled</b>Add one from a customer call or lead record.</div>`}catch(error){root.innerHTML=`<div class="empty"><b>Follow-ups unavailable</b>${esc(error.message)}</div>`}}
    function renderCategories(){const filter=activeFilter;const list=categories.filter(c=>!filter||c.code.includes(filter)||c.name.toLowerCase().includes(filter.toLowerCase())||c.desc.toLowerCase().includes(filter.toLowerCase()));return `${pageHead('Training categories','Plain-English internal reference for common UK commercial vehicle routes.',`<input class="search" id="category-search" placeholder="Search categories" value="${esc(filter)}">`)}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${list.map(c=>`<article class="panel"><div style="display:flex;align-items:flex-start;justify-content:space-between"><div><div class="eyebrow">${esc(c.code)}</div><h2 style="font:700 14px Manrope;margin:0 0 9px">${esc(c.name)}</h2></div><span class="pill blue">Route guide</span></div><p style="font-size:10px;line-height:1.55;color:#66736f">${esc(c.desc)}</p><div class="divider"></div><p class="section-title">Typical areas to check</p><p style="font-size:10px;line-height:1.6;color:#52605b">${esc(c.steps)}</p><div class="warning">${esc(c.check)}</div></article>`).join('')}</div>`}
    function renderCentres(){return `${pageHead('Training centres','Compare partner providers once centre details and agreements are added.',`<button class="btn primary" data-action="add-centre">＋ &nbsp;Add centre</button>`)}<div class="panel"><div class="panel-heading"><div><h2>Provider directory</h2><p>Centre information and trade rates should be maintained by an authorised administrator.</p></div></div><div class="empty"><b>No partner centres have been added</b>Use Settings to configure providers, categories, fees, VAT treatment and cancellation terms. Compare total customer price and availability before recommending a centre.</div><div class="field-note">Suggested record fields: provider · location · postcode · categories and test elements offered · trade and retail prices · contact details · agreement status · commission · cancellation policy · payment terms.</div></div>`}
    function renderPricing(){return `${pageHead('Pricing catalogue','Approved partner retail pricing. Provider costs and margin are role-restricted.',`<button class="btn primary" data-action="open-quote">＋ &nbsp;Build quote</button>`)}<div class="panel" id="retail-price-panel"><div class="empty"><b>Loading approved retail prices</b>Price items are provided by the server catalogue.</div></div>`}
    function renderKnowledge(){const data=[['Licence categories','Use the exact entitlement shown on the driving record. Informal terms such as Class 1, Class 2, artic and 7.5t can help identify a likely route, not establish legal entitlement.'],['Driver CPC','Ask whether the customer will drive professionally. Initial and periodic requirements differ; verify current exemptions and requirements on GOV.UK / DVSA.'],['Medical / D4','Do not diagnose or determine fitness. Record the customer’s status and refer medical questions to DVLA or an appropriate medical professional.'],['Theory and hazard perception','Track multiple choice and hazard perception separately. Record test date and result; confirm applicable requirements and validity before booking.'],['Practical training','Use an assessment to inform a training band. Do not promise that a set number of hours guarantees a pass.'],['Customer objections','Acknowledge the concern, clarify what matters, explain inclusions and terms accurately, and offer time or a follow-up without pressure.'],['Entitlement verification','Age and licence acquisition dates alone do not prove acquired rights. Check the customer’s official record and current guidance.']];return `${pageHead('Knowledge base','Quick reference prompts for common questions during a customer conversation.',`<input class="search" id="knowledge-search" placeholder="Search guidance">`)}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(245px,1fr))">${data.map(([h,p])=>`<article class="panel knowledge-card"><div class="eyebrow">Staff reference</div><h2 style="font:700 14px Manrope;margin:0 0 9px">${h}</h2><p style="font-size:10px;line-height:1.6;color:#64716d;margin:0">${p}</p></article>`).join('')}</div>`}
    function renderDocuments(){return `${pageHead('Documents','Track only what is needed and use an approved secure system for identity documents.',`<button class="btn" data-view="call">Back to consultation</button>`)}<div class="panel"><div class="panel-heading"><div><h2>Customer document checklist</h2><p>Checklist template; no files are uploaded or retained by this local application.</p></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(205px,1fr))">${['Driving licence front','Driving licence back where relevant','D4 / medical evidence','Theory test results','Hazard perception result','CPC Module 2 result','Provisional entitlement evidence','Provider booking form','Test confirmation','Payment receipt'].map((d,i)=>`<label class="field" style="display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid #edf0ef;font-size:10px"><input type="checkbox" data-doc="${i}" style="accent-color:#23766c">${d}</label>`).join('')}</div><div class="warning">Do not store unnecessary identity data. This version does not provide secure upload, retention controls, encryption at rest or role-based access.</div></div>`}
    function renderReports(){const statuses={};state.leads.forEach(l=>statuses[l.status]=(statuses[l.status]||0)+1);return `${pageHead('Reports','A snapshot of records in this browser. Connect a backend for shared reporting.',`<button class="btn" data-action="export-leads">Export lead list</button>`)}<div class="grid stats"><div class="stat"><div class="stat-top">Saved leads</div><div class="stat-value">${state.leads.length}</div><div class="stat-note">Current local dataset</div></div><div class="stat"><div class="stat-top">Qualified</div><div class="stat-value">${statuses.Qualified||0}</div><div class="stat-note">Lead status</div></div><div class="stat"><div class="stat-top">Quotes sent</div><div class="stat-value">${statuses['Quote Sent']||0}</div><div class="stat-note">Lead status</div></div><div class="stat"><div class="stat-top">Booked</div><div class="stat-value">${statuses.Booked||0}</div><div class="stat-note">Lead status</div></div><div class="stat"><div class="stat-top">Estimated pipeline</div><div class="stat-value">£${money(state.leads.reduce((a,l)=>a+Number(l.quote||0),0))}</div><div class="stat-note">Estimate, not revenue</div></div></div><div class="panel"><div class="panel-heading"><div><h2>Lead stages</h2><p>Counts reflect saved records only.</p></div></div>${Object.entries(statuses).length?Object.entries(statuses).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #edf0ef;font-size:10px"><span>${esc(k)}</span><strong>${v}</strong></div>`).join(''):`<div class="empty"><b>No report data yet</b>Saved leads will appear here.</div>`}</div>`}
    function renderSettings(){return `${pageHead('Settings','Account access, AI configuration, and application data controls.',`<button class="btn" data-action="export-leads">Export leads</button>`)}<div class="grid dashboard-grid"><div class="panel"><div class="panel-heading"><div><h2>Workspace data</h2><p>Signed in as ${esc(sessionUser?.name||'staff')} · ${esc(sessionUser?.role||'')}</p></div><span class="pill green">Server-backed</span></div><p style="font-size:10px;line-height:1.6;color:#66736f">Consultations, leads, quotes, follow-ups, provider records, and audit events are stored through the application API. Local development uses SQLite; production must use PostgreSQL.</p><div class="warning">Secure document object storage, production backups, retention automation, TLS termination, and deployment monitoring must be configured before live use.</div></div><div class="panel"><div class="panel-heading"><div><h2>Data tools</h2><p>Exports are sensitive and remain subject to company privacy controls.</p></div></div><div class="quick-row"><button class="btn" data-action="export-leads">Export permitted leads</button><button class="btn" data-action="print-summary">Print consultation</button><button class="btn" data-action="clear-data">Forget legacy browser copy</button></div><p class="field-note">Legacy browser-demo data can be imported once during development. This action only removes the old browser copy; it does not delete server records.</p></div></div>`}
    function bindPage(){document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.filter)activeFilter=b.dataset.filter;setView(b.dataset.view)}));document.querySelectorAll('[data-profile]').forEach(el=>el.addEventListener('input',()=>{state.profile[el.dataset.profile]=el.value;save();updateIdentity()}));const status=$('[data-status]');if(status)status.addEventListener('change',()=>{state.currentStatus=status.value;save()});const notes=$('[data-callnotes]');if(notes)notes.addEventListener('input',()=>{state.callNotes=notes.value;save()});document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>recordAnswer(b.dataset.id,b.dataset.answer,b.dataset.type)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b.dataset.id)));const s=$('#lead-search');if(s)s.addEventListener('input',()=>{const term=s.value.toLowerCase();document.querySelectorAll('tr[data-lead]').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(term))});const cs=$('#category-search');if(cs)cs.addEventListener('input',()=>{activeFilter=cs.value;const term=cs.value.toLowerCase();document.querySelectorAll('.panel').forEach(card=>{if(card.classList.contains('knowledge-card'))card.hidden=!card.textContent.toLowerCase().includes(term)})});const ks=$('#knowledge-search');if(ks)ks.addEventListener('input',()=>{const term=ks.value.toLowerCase();document.querySelectorAll('.knowledge-card').forEach(card=>card.hidden=!card.textContent.toLowerCase().includes(term))});document.querySelectorAll('[data-price]').forEach(el=>el.addEventListener('input',()=>{state.quote[el.dataset.price]=Number(el.value);save()}));}
    function updateIdentity(){const h=$('.identity h2'),av=$('.identity-avatar'),p=$('.identity p');if(h)h.textContent=customerName();if(av)av.textContent=initials(customerName());if(p)p.innerHTML=`${esc(state.profile.phone||'Add phone number')} &nbsp;·&nbsp; ${esc(state.profile.email||'Add email address')} &nbsp;·&nbsp; <span class="pill dot">${esc(state.currentStatus||'New Lead')}</span>`}
    function recordAnswer(id,value,type){if(type==='multi'){let existing=state.answers[id]||[];existing=existing.includes(value)?existing.filter(v=>v!==value):[...existing,value];if(!existing.length)delete state.answers[id];else state.answers[id]=existing;}else state.answers[id]=value;if(id==='goal')state.questionNotes.goal=value;serverQuestionLoaded=false;serverQuestion=null;state.events.push({at:new Date().toISOString(),text:`Recorded ${id}: ${Array.isArray(state.answers[id])?state.answers[id].join(', '):state.answers[id]||'updated'}`});save();render();}
    function submitText(id){const el=$('#answer-input');if(!el||!el.value.trim()){notify('Add a response before recording it.');return}if(id==='goal'){state.questionNotes.goal=el.value.trim();state.answers.goal=el.value.trim()}else{state.questionNotes[id]=el.value.trim();state.answers[id]=el.value.trim()}serverQuestionLoaded=false;serverQuestion=null;save();render();}
    function action(name,id){if(name==='submit-text')return submitText(id);if(name==='skip-question'){state.answers[id]='Not answered';state.questionNotes[id]='Skipped; follow up';save();render();return}if(name==='save-lead')return saveLead();if(name==='reset-call')return resetCall();if(name==='reset-questions'){state.answers={};state.questionNotes={};save();render();return}if(name==='open-quote')return openQuote();if(name==='open-followup')return openFollowup();if(name==='save-followup')return saveFollowupFromModal();if(name==='create-quote')return createQuoteFromModal();if(name==='quote-sent')return markQuoteSent();if(name==='prepare-booking')return prepareBooking(id);if(name==='print-quote')return window.print();if(name==='extract-notes')return extractDetails();if(name==='confirm-extraction')return confirmExtraction();if(name==='save-pricing'){save();notify('Pricing values saved for this browser.');return}if(name==='export-leads')return exportLeads();if(name==='print-summary')return window.print();if(name==='clear-data')return confirmClear();if(name==='add-centre')return notify('Provider records require a connected, access-controlled admin service.');if(name==='copy-summary')return copySummary();}
    async function saveLead(){const name=customerName();if(name==='New customer'&&!state.profile.phone&&!state.profile.email){notify('Add a customer name or contact detail before saving.');return}try{await persistDraft();const {notes,...profile}=state.profile;const question=nextQuestion();const result=await apiFetch('/leads',{method:'POST',body:{profile,answers:state.answers,route:route()||undefined,status:state.currentStatus||'Consultation Started',estimatePence:Math.round(price()*100),notes:state.callNotes||notes||'',clientDraftKey:currentDraftKey,progress,currentStage:question?stages[question.stage]:'Follow-up / booking'}});const lead=result.lead;const existing=state.leads.find(item=>item.id===lead.id);if(existing)Object.assign(existing,lead);else state.leads.unshift(lead);state.currentLeadId=lead.id;currentCustomerId=lead.customerId;state.currentStatus=lead.status;save();notify('Lead saved securely.');render()}catch(error){notify(`Lead could not be saved: ${error.message}`)}}
    function resetCall(){if((Object.keys(state.answers).length||state.profile.first)&&!confirm('Start a new call? Save this customer first if you need to keep the current consultation.'))return;state.profile={...defaults.profile};state.answers={};state.questionNotes={};state.callNotes='';state.currentLeadId=null;currentCustomerId=null;currentConsultationId=null;currentQuoteId=null;currentQuoteTotal=0;currentDraftKey=crypto.randomUUID();serverQuestionLoaded=false;serverQuestion=null;state.currentStatus='New Lead';state.callStarted=Date.now();save();setView('call')}
    async function openQuote(){if(customerName()!=='New customer'&&!state.currentLeadId)await saveLead();if(!state.currentLeadId&&!state.leads.length){notify('Start a call and save the customer before creating a quote.');return}try{const result=await apiFetch('/pricing');priceCatalog=result.prices||[];if(!priceCatalog.length){notify('No approved retail prices are configured. Ask an administrator to add provider price items.');return}const savedOptions=state.leads.map(lead=>`<option value="${esc(lead.id)}" ${lead.id===state.currentLeadId?'selected':''}>${esc(lead.name)} · ${esc(lead.route||'Unconfirmed')}</option>`).join('');$('#overlay-root').innerHTML=`<div class="modal-backdrop" data-dismiss><section class="modal"><div class="modal-head"><h2>Build customer quote</h2><button class="btn small" data-close>✕</button></div><div class="modal-content"><div class="field-grid"><div class="field full"><label for="quote-lead">Customer</label><select id="quote-lead">${savedOptions}</select></div></div><div class="divider"></div><p class="section-title">Available retail price items</p><div style="max-height:300px;overflow:auto">${priceCatalog.map(item=>`<label class="field" style="grid-template-columns:18px 1fr auto;align-items:center;padding:10px 0;border-bottom:1px solid #edf0ef"><input type="checkbox" data-quote-item="${esc(item.id)}" style="accent-color:#23766c"><span><strong>${esc(item.description)}</strong><small style="display:block;color:#75817e;margin-top:3px">${esc(item.category||'General')} · ${esc(item.provider?.name||'Provider')} ${item.trainingCentre?`· ${esc(item.trainingCentre.location)}`:''}</small></span><strong>£${money(item.retailPricePence/100)}</strong></label>`).join('')}</div><div class="field-grid" style="margin-top:14px"><div class="field"><label for="quote-deposit">Deposit (£)</label><input type="number" id="quote-deposit" min="0" step="0.01" value="0"></div><div class="field"><label for="quote-discount">Discount (£)</label><input type="number" id="quote-discount" min="0" step="0.01" value="0"></div></div><div class="warning">The server calculates VAT, totals, deposit and balance from approved price records. Provider costs and margin are not shown here.</div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-action="create-quote">Create draft quote</button></div></section></div>`;bindModal()}catch(error){notify(`Pricing could not be loaded: ${error.message}`)}}
    async function createQuoteFromModal(){const selected=$('#quote-lead')?.value;const lead=state.leads.find(item=>item.id===selected);if(!lead?.customerId){notify('Select a customer record before creating a quote.');return}const items=[...document.querySelectorAll('[data-quote-item]:checked')].map(input=>({priceItemId:input.dataset.quoteItem,quantity:1}));if(!items.length){notify('Choose at least one approved price item.');return}const depositPence=Math.round(Number($('#quote-deposit').value||0)*100),discountPence=Math.round(Number($('#quote-discount').value||0)*100);try{const result=await apiFetch('/quotes',{method:'POST',body:{customerId:lead.customerId,leadId:lead.id,items,depositPence,discountPence}});currentQuoteId=result.quote.id;currentLeadId=lead.id;currentCustomerId=lead.customerId;$('#overlay-root').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>Draft quote created</h2><button class="btn small" data-close>✕</button></div><div class="modal-content"><div class="eyebrow">${esc(lead.name)} · ${esc(lead.route||'Training')}</div><table class="quote-lines">${result.quote.items.map(item=>`<tr><td>${esc(item.description)} × ${item.quantity}</td><td>£${money(item.lineTotalPence/100)}</td></tr>`).join('')}<tr><td>VAT</td><td>£${money(result.quote.vatPence/100)}</td></tr><tr><td>Discount</td><td>-£${money(result.quote.discountPence/100)}</td></tr></table><div class="quote-total">£${money(result.quote.totalPence/100)}<small>Deposit £${money(result.quote.depositPence/100)} · Balance £${money(result.quote.balancePence/100)}</small></div><div class="warning">Estimate and provider availability must be verified before sending.</div></div><div class="modal-foot"><button class="btn" data-close>Close</button><button class="btn" data-action="print-quote">Print</button><button class="btn primary" data-action="quote-sent">Mark sent</button></div></section></div>`;bindModal();notify('Draft quote saved.')}catch(error){notify(`Quote could not be created: ${error.message}`)}}
    async function markQuoteSent(){if(!currentQuoteId){notify('Create a draft quote first.');return}try{await apiFetch(`/quotes/${currentQuoteId}/status`,{method:'PATCH',body:{status:'SENT'}});if(currentLeadId){await apiFetch(`/leads/${currentLeadId}`,{method:'PATCH',body:{status:'Quote Sent'}});const lead=state.leads.find(item=>item.id===currentLeadId);if(lead)lead.status='Quote Sent';state.currentStatus='Quote Sent'}$('#overlay-root').innerHTML='';save();notify('Quote marked as sent.')}catch(error){notify(`Quote status could not be updated: ${error.message}`)}}
    function extractionRows(value){const rows=[];if(value.age!==null)rows.push(['age','Age',String(value.age)]);if(value.licenceStatus)rows.push(['licence','UK car licence',({FULL_UK_B:'Yes',PROVISIONAL_UK_B:'No',NO_UK_LICENCE:'No',UNSURE:'Not sure'})[value.licenceStatus],['Yes','No','Not sure']]);if(value.goal)rows.push(['goal','Training goal',({C_PLUS_E:'Articulated lorry',C:'Rigid lorry',C1:'7.5 tonne vehicle',C1_PLUS_E:'C1+E vehicle with trailer',D:'Bus or coach',D1:'Minibus',DRIVER_CPC:'Get Driver CPC',UNSURE:'Not sure'})[value.goal],['Articulated lorry','Rigid lorry','7.5 tonne vehicle','C1+E vehicle with trailer','Bus or coach','Minibus','Get Driver CPC','Not sure']]);if(value.medicalStatus)rows.push(['medical','Medical / D4 status',({COMPLETED:'Completed',BOOKED:'Booked',NOT_COMPLETED:'Not yet',UNSURE:'Not sure'})[value.medicalStatus],['Completed','Booked','Not yet','Not sure']]);if(value.theoryStatus)rows.push(['theory','Theory test status',({PASSED:'Both passed',BOOKED:'Booked',NOT_COMPLETED:'Not started',PARTIAL:'Some passed',UNSURE:'Not sure'})[value.theoryStatus],['Both passed','Booked','Some passed','Not started','Not sure']]);if(value.cpcRequired!==null)rows.push(['cpc','Professional driving',value.cpcRequired?'Yes, professionally':'No, private use',['Yes, professionally','No, private use','Not sure']]);if(value.experience)rows.push(['experience','Driving experience',({NONE:'No experience',SOME_TRAINING:'Some training',UK_HGV:'UK HGV experience',INTERNATIONAL:'International experience',REFRESHER:'Need refresher',UNSURE:'Not sure'})[value.experience],['No experience','Some training','UK HGV experience','International experience','Need refresher','Not sure']]);if(value.preferredLocation)rows.push(['location','Preferred location',value.preferredLocation]);return rows}
    async function extractDetails(){const text=state.callNotes?.trim();if(!text){notify('Add a call note before extracting details.');return}try{await persistDraft();if(!currentConsultationId){notify('The consultation could not be saved to the server.');return}const result=await apiFetch('/ai/extract',{method:'POST',body:{text,consultationId:currentConsultationId}});const rows=extractionRows(result.extraction||{});if(!rows.length){notify('No structured details were identified. Continue with the guided questions.');return}$('#overlay-root').innerHTML=`<div class="modal-backdrop" data-dismiss><section class="modal"><div class="modal-head"><h2>Review extracted details</h2><button class="btn small" data-close>✕</button></div><div class="modal-content"><p style="font-size:10px;color:#67736f;line-height:1.55">${result.aiUsed?'AI suggestions':'Rule-based suggestions'} · Nothing is saved until you confirm selected fields. Correct any value before confirming.</p><div class="grid" style="gap:10px">${rows.map(([key,label,value,options])=>`<div class="field-grid" style="grid-template-columns:24px minmax(100px,.8fr) minmax(150px,1.2fr);align-items:end"><label class="field" style="display:flex;align-items:center;gap:7px"><input type="checkbox" data-extract-accept="${key}" checked style="accent-color:#23766c">Use</label><label class="field"><span>${esc(label)}</span>${options?`<select data-extract-value="${key}">${options.map(option=>`<option ${option===value?'selected':''}>${esc(option)}</option>`).join('')}</select>`:`<input data-extract-value="${key}" value="${esc(value)}">`}</label></div>`).join('')}</div><div class="warning">Licence, CPC and medical information must still be verified. This extraction is not an eligibility decision.</div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-action="confirm-extraction">Confirm selected fields</button></div></section></div>`;bindModal()}catch(error){notify(`Details could not be extracted: ${error.message}`)}}
    async function confirmExtraction(){const fields={};document.querySelectorAll('[data-extract-accept]:checked').forEach(check=>{const key=check.dataset.extractAccept,control=document.querySelector(`[data-extract-value="${key}"]`);if(control&&control.value.trim())fields[key]=control.value.trim()});if(!Object.keys(fields).length){notify('Select at least one field to confirm.');return}const path=`/consultations/${currentConsultationId}/confirm-extraction`;try{let result;try{result=await apiFetch(path,{method:'POST',body:{fields}})}catch(error){if(error.code!=='CONFIRMED_DATA_EXISTS'||!confirm('Some values differ from previously confirmed information. Replace those values with the corrections you reviewed?'))throw error;result=await apiFetch(path,{method:'POST',body:{fields,replaceExisting:true}})}state.answers={...state.answers,...fields};if(fields.location)state.profile.location=fields.location;if(fields.goal)state.questionNotes.goal=fields.goal;$('#overlay-root').innerHTML='';save();render();notify('Selected details saved to the consultation.')}catch(error){notify(`Confirmed details were not saved: ${error.message}`)}}
    function openFollowup(){const tomorrow=new Date(Date.now()+86400000);tomorrow.setHours(10,0,0,0);const currentOption=customerName()!=='New customer'?`<option value="__current__">Current call · ${esc(customerName())}</option>`:'';const savedOptions=state.leads.map(lead=>`<option value="${esc(lead.id)}" ${lead.id===state.currentLeadId?'selected':''}>${esc(lead.name)} · ${esc(lead.route||'Unconfirmed')}</option>`).join('');$('#overlay-root').innerHTML=`<div class="modal-backdrop" data-dismiss><section class="modal"><div class="modal-head"><h2>Schedule follow-up</h2><button class="btn small" data-close>✕</button></div><div class="modal-content"><div class="field-grid"><div class="field full"><label for="followup-lead">Customer</label><select id="followup-lead">${currentOption}${savedOptions}</select></div><div class="field"><label for="followup-date">Due date and time</label><input type="datetime-local" id="followup-date" value="${new Date(tomorrow.getTime()-tomorrow.getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="field"><label for="followup-reason">Reason</label><select id="followup-reason">${['Call back','Quote follow-up','Awaiting documents','Awaiting medical','Awaiting theory','Awaiting payment','Check training dates','Retest','General follow-up'].map(v=>`<option>${v}</option>`).join('')}</select></div></div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-action="save-followup">Save follow-up</button></div></section></div>`;bindModal()}
    async function saveFollowupFromModal(){const due=$('#followup-date')?.value,selected=$('#followup-lead')?.value;if(!due||!selected){notify('Choose a customer and follow-up date.');return}let lead;if(selected==='__current__'){await saveLead();lead=state.leads.find(item=>item.id===state.currentLeadId)}else lead=state.leads.find(item=>item.id===selected);if(!lead?.customerId){notify('Save this customer as a lead before scheduling.');return}try{const result=await apiFetch('/follow-ups',{method:'POST',body:{customerId:lead.customerId,leadId:lead.id,reason:$('#followup-reason').value,dueAt:new Date(due).toISOString()}});lead.followup=result.followUp.dueAt;lead.followupReason=result.followUp.reason;lead.updated=new Date().toISOString();state.currentLeadId=lead.id;state.currentStatus=lead.status;$('#overlay-root').innerHTML='';save();notify('Follow-up scheduled.');if(currentView==='followups'||currentView==='dashboard')render()}catch(error){notify(`Follow-up could not be saved: ${error.message}`)}}
    function bindModal(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#overlay-root').innerHTML='');const backdrop=$('.modal-backdrop');if(backdrop)backdrop.addEventListener('click',e=>{if(e.target===backdrop)$('#overlay-root').innerHTML=''});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>void action(b.dataset.action,b.dataset.id))}
    function copySummary(){const text=`${customerName()} | ${state.profile.phone||''} | ${state.profile.email||''}\nGoal: ${state.questionNotes.goal||state.answers.goal||'Not recorded'}\nLikely route: ${routeLabel()}\nStatus: ${state.currentStatus||'New Lead'}\nOutstanding: ${outstandingChecks()}\nEstimate: £${money(price())}\nNotes: ${state.callNotes||state.profile.notes||''}\nVerify current DVLA/DVSA/GOV.UK requirements before booking.`;navigator.clipboard?.writeText(text).then(()=>notify('Summary copied.')).catch(()=>notify('Clipboard is unavailable in this browser.'))}
    function exportLeads(){const header=['Name','Phone','Email','Route','Status','Estimate GBP','Follow-up','Created'];const csv=[header,...state.leads.map(l=>[l.name,l.phone,l.email,l.route,l.status,l.quote,l.followup,l.created])].map(row=>row.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='smart-taxi-leads.csv';a.click();URL.revokeObjectURL(a.href)}
    function confirmClear(){if(confirm('Remove the legacy demo copy from this browser? Server records will remain unchanged.')){localStorage.removeItem(STORAGE);legacyDemo=null;notify('Legacy browser copy removed. Server records were not changed.')}}
    document.addEventListener('click',event=>{const button=event.target.closest('[data-action="prepare-booking"]');if(button)void prepareBooking(button.dataset.id)});document.querySelectorAll('#nav-main button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$('#quick-new').addEventListener('click',()=>setView('call'));$('#quick-followup').addEventListener('click',openFollowup);$('#menu-toggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#logout').addEventListener('click',signOut);$('#today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});void bootstrap();setInterval(()=>{const d=$('#duration');if(d)d.textContent=new Date(Date.now()-state.callStarted).toISOString().slice(14,19)},1000);
  })();
  </script>
  <script>
    (()=>{
      const connectLabels=()=>document.querySelectorAll('.field').forEach((field,index)=>{
        const label=field.querySelector('label');
        const control=field.querySelector('input,select,textarea');
        if(label&&control&&!label.htmlFor){
          const id=control.id||`form-field-${index}`;
          control.id=id;
          label.htmlFor=id;
        }
      });
      new MutationObserver(connectLabels).observe(document.body,{childList:true,subtree:true});
      connectLabels();
    })();
  </script>
